name: CI
# spotless/detekt (P0-04) and :dsp:test (P0-02) are added back when those exist.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Gradle project
        id: detect
        run: |
          if [ -f gradlew ]; then echo "has_gradle=true" >> "$GITHUB_OUTPUT"; else echo "has_gradle=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.detect.outputs.has_gradle == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.has_gradle == 'true'

      - name: Make gradlew executable
        if: steps.detect.outputs.has_gradle == 'true'
        run: chmod +x gradlew

      - name: Lint
        if: steps.detect.outputs.has_gradle == 'true'
        run: ./gradlew lintDebug

      - name: Unit tests
        if: steps.detect.outputs.has_gradle == 'true'
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        if: steps.detect.outputs.has_gradle == 'true'
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: steps.detect.outputs.has_gradle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure() && steps.detect.outputs.has_gradle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
